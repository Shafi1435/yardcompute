name: Branding asset checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, branding/logo-kit-integration]

permissions:
  contents: read

jobs:
  validate-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate SVG assets and referenced branding files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path(".")
          svg_files = list((root / "public").rglob("*.svg"))
          if not svg_files:
              raise SystemExit("No SVG files found under public/")
          for path in svg_files:
              ET.parse(path)
              print(f"SVG OK: {path}")

          html_files = list((root / "public").rglob("*.html"))
          if not html_files:
              raise SystemExit("No HTML files found under public/")
          for html in html_files:
              text = html.read_text(encoding="utf-8")
              for target in re.findall(r'''(?:href|src)=["'](/[^"'#?]+)["']''', text):
                  if target.startswith("//"):
                      continue
                  local = root / "public" / target.lstrip("/")
                  if not local.exists() and not target.endswith("/"):
                      # External/site routes may be generated by deployment; only report
                      # known branding asset paths as hard failures.
                      if any(name in target for name in ("favicon", "yardcompute-logo", "social-share", "apple-touch-icon")):
                          raise SystemExit(f"Missing referenced branding asset in {html}: {target}")
          print(f"HTML files scanned: {len(html_files)}")
          PY