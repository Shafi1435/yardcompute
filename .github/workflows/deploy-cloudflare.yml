name: Deploy YardCompute to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yardcompute-production-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production homepage and key calculators
        env:
          SITE_URL: https://yardcompute.com
        run: |
          set -euo pipefail
          for path in / /fence-calculators/fence-picket-spacing-calculator/ /gravel-calculators/french-drain-gravel-calculator/ /landscaping-calculators/grass-seed-calculator/; do
            echo "Checking ${SITE_URL}${path}"
            status=$(curl --silent --show-error --location --output /tmp/yardcompute-response.html --write-out '%{http_code}' --max-time 30 "${SITE_URL}${path}")
            if [ "$status" != "200" ]; then
              echo "FAIL: ${SITE_URL}${path} returned HTTP $status"
              exit 1
            fi
            if ! grep -qi '<html' /tmp/yardcompute-response.html; then
              echo "FAIL: ${SITE_URL}${path} did not return an HTML document"
              exit 1
            fi
          done
          echo "All production URL smoke checks passed."
